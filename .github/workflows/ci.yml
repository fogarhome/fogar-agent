# CI for fogar-agent. NOT run from the build sandbox (written in slice 0, first run pending).
# Actions are pinned by full commit SHA; the SHA below was verified with
# `git ls-remote https://github.com/actions/checkout` on 2026-11-13 (tag v6.1.0, lightweight).
name: ci
on:
  push:
    branches: [main, "slice-*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  # ADR-0007: a PR can rewrite the agent config, the hash lists and the checkers together (even
  # this workflow), so nothing inside the PR can approve itself. This job only makes such a change
  # loud: it is red whenever a PR touches them, and a human merging over it is the
  # acknowledgement. Enforcing that needs branch protection + CODEOWNERS (a repository setting).
  agent-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2 # the PR merge commit and its first parent, the base
      - name: Agent config and gates unchanged (ADR-0007)
        run: |
          set -f # git, not the shell, matches crates/*/clippy.toml (in both trees)
          paths="agent-team .claude scripts .github .cargo rust-toolchain.toml deny.toml supply-chain clippy.toml
            crates/*/clippy.toml crates/fogar-archtest docs/adr/0007-agent-config-integrity.md
            CLAUDE.md **/CLAUDE.md"
          # shellcheck disable=SC2086 # word-split on purpose: one pathspec per word
          if ! git diff --stat --exit-code HEAD^1 HEAD -- $paths; then
            echo "::error::This PR changes agent config or the gates (above): a human must merge it knowingly (ADR-0007)"
            exit 1
          fi

  linux-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Supply-chain tools (pinned versions)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.23.0
      - name: Gates
        run: scripts/gates.sh

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Pinned nightly + miri
        run: rustup toolchain install nightly-2026-11-01 --profile minimal --component miri,rust-src
      - name: Miri on every crate with unsafe compiled on Linux
        run: cargo +nightly-2026-11-01 miri test -p fogar-testalloc

  macos:
    # The FIRST compiler that sees fogar-agent-macos and platform_macos.rs (untested in slice 0).
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (macOS cfg paths)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (incl. macOS adapter contract suites)
        run: cargo test --workspace --locked
      # Fogar Desktop (apps/macos): the Swift tests and the generated wire types. The package needs
      # Swift 6.2 / the macOS 26 SDK, so the newest installed Xcode 26 is selected explicitly.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$xcode" || { echo "no Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          swift --version
      - name: typeshare-cli (pinned)
        run: cargo install --locked typeshare-cli --version 1.13.4
      - name: Fogar Desktop tests and Wire.swift check
        run: cd apps/macos && swift test && scripts/gen-wire.sh --check

  supply-chain:
    # cargo vet + the unsafe-count baseline (scripts/geiger.sh) on both OSes: the macOS adapter and its
    # Security.framework deps only build on macOS. Own job: building the two tools takes long enough
    # to strain linux-gates' timeout. Versions verified on crates.io on 2026-11-16.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tools (pinned versions)
        run: |
          cargo install --locked cargo-vet --version 0.10.3
          cargo install --locked cargo-geiger --version 0.14.0
      - name: cargo vet (no fetching; supply-chain/imports.lock is committed)
        run: cargo vet --locked
      - name: cargo geiger vs supply-chain/geiger-<os>.txt
        run: python3 -I scripts/geiger_check.py --self-test && scripts/geiger.sh
