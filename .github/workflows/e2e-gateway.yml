# This branch tracks the gateway's next/5.0 (GATEWAY_LATEST) until 5.0 ships.
# E2E of fogar-agent against the REAL fogar-gateway (Python, its fake OpenClaw, no STT/TTS), and
# the drift check of the Rust mock against the gateway spec (crates/fogar-testkit/tests/spec_pin.rs).
# - push / pull_request: must be green before merge (a red check; NOT enforced: this plan has no
#   branch protection), at the gateway commit pinned in
#   crates/fogar-agentd/tests/real_gateway/GATEWAY_REF (bump that one line to move it). The pin
#   must be on gateway main or GATEWAY_LATEST (checked below), never a fork-only commit.
# - daily / manual: the newest gateway development line (GATEWAY_LATEST). Not a PR check, so a red
#   run only warns that the gateway moved: update the mock / the agent, then bump GATEWAY_REF.
# The job runs the gateway's own code (uv sync + its tests/fakes), so it holds no secret and a
# read-only token; checkouts keep no credentials. Actions pinned by SHA (verified with
# `git ls-remote` on 2026-11-17: checkout v6.1.0, setup-uv v10.3.3 of 2026-10-28).
# Never add a cache to this job: the gateway code it runs could poison main's cache scope.
name: e2e-gateway
on:
  push:
    branches: [main, "slice-*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  # The newest gateway development line ("latest").
  GATEWAY_LATEST: next/5.0
  UV_PYTHON: "3.12"

jobs:
  real-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Gateway ref (pinned commit, or the latest line on schedule/manual runs)
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) ref="$GATEWAY_LATEST" ;;
            *)
              ref=$(tr -d '[:space:]' < crates/fogar-agentd/tests/real_gateway/GATEWAY_REF)
              echo "$ref" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::GATEWAY_REF must be a full commit SHA"; exit 1; }
              ;;
          esac
          echo "GATEWAY_CHECKOUT_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: fogarhome/fogar-gateway
          ref: ${{ env.GATEWAY_CHECKOUT_REF }}
          path: fogar-gateway
          fetch-depth: 0 # all branches, for the provenance check
          persist-credentials: false
      - name: Gateway commit is on main or the latest line (not a fork-only object)
        working-directory: fogar-gateway
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            git merge-base --is-ancestor HEAD "origin/$GATEWAY_LATEST" ||
            { echo "::error::$(git rev-parse HEAD) is on neither main nor $GATEWAY_LATEST"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Gateway environment (locked)
        working-directory: fogar-gateway
        run: |
          git log -1 --format='gateway %H %s'
          uv sync --locked
      # `1 passed` proves the filter matched; no skip line proves the test did not take its skip path.
      - name: Pairing lifecycle against the real gateway
        env:
          FOGAR_GATEWAY_DIR: ${{ github.workspace }}/fogar-gateway
        run: |
          cargo test --locked -p fogar-agentd --test s1_pairing_e2e -- --exact pairing_lifecycle_against_the_real_gateway --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e.out"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/e2e.out"
          ! grep -q "real-gateway E2E skipped" "$RUNNER_TEMP/e2e.out"
      - name: Mock follows the gateway spec
        if: ${{ !cancelled() }}
        env:
          FOGAR_GATEWAY_DIR: ${{ github.workspace }}/fogar-gateway
        run: |
          cargo test --locked -p fogar-testkit --test spec_pin -- --exact mock_follows_the_gateway_spec --nocapture 2>&1 | tee "$RUNNER_TEMP/pin.out"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/pin.out"
          ! grep -q "spec drift check skipped" "$RUNNER_TEMP/pin.out"
