[package]
name = "fogar-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Composition root: the daemon binary. The ONLY crate (besides adapters) with cfg(target_os) wiring."

[features]
# IPC-4 development opt-in: Login/Logout/Reconnect also from IPC peers checked by uid only (ad-hoc signed
# or unsigned builds, Linux). Never enable it for a release build.
dev-uid-pairing = []

[[bin]]
name = "fogar-agentd"
path = "src/main.rs"

[dependencies]
fogar-core = { workspace = true }
fogar-ports = { workspace = true }
fogar-host = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "signal", "sync"] }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
fogar-agent-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
fogar-agent-macos = { workspace = true }

[dev-dependencies]
fogar-testkit = { workspace = true }
fogar-proto = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
futures-util = { workspace = true, features = ["sink", "std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
fogar-agent-linux = { workspace = true }

[lints]
workspace = true
