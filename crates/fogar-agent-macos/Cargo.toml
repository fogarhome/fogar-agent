[package]
name = "fogar-agent-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "macOS adapters: Keychain secret store and Unix-socket IPC with a same-signer peer check (S1); cpal/CoreAudio audio and AVCaptureDevice mic permission (S2); probe/power partial. Compiles to an empty crate on other hosts."

# Apple binding crates only under this target table (deny.toml wrappers).
[target.'cfg(target_os = "macos")'.dependencies]
fogar-ports = { workspace = true }
fogar-host = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "process"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["alloc"] }
security-framework = { workspace = true }
core-foundation = { workspace = true }
libc = { workspace = true }
cpal = { workspace = true }
rtrb = { workspace = true }
objc2 = { workspace = true, features = ["std"] }
block2 = { workspace = true, features = ["std"] }

[dev-dependencies]
fogar-testkit = { workspace = true }
fogar-ports = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = { workspace = true }

[lints]
workspace = true
