[package]
name = "exp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tokio-tungstenite = "=0.30.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
rand = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

tokio-metrics = "=0.5.2"
tracing-appender = "=0.2.5"
secrecy = "=0.10.3"
arc-swap = "=1.9.5"
tikv-jemallocator = "=0.7.0"
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats"] }

[dev-dependencies]
turmoil = "=0.7.2"
tokio = { version = "=1.54.1", features = ["full", "test-util"] }

[profile.release]
debug = 1

[profile.release-abort]
inherits = "release"
panic = "abort"
